name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-release.txt
      # exact versions + hashes: a tampered or surprise package fails the build
      - run: pip install --require-hashes -r requirements-release.txt
      - run: python -m pytest -q
      - if: startsWith(github.ref, 'refs/tags/v')
        run: ./bump-version.ps1 "${{ github.ref_name }}"
        shell: pwsh
      - run: ./build-release.ps1
        shell: pwsh

      # published hash lets users check the download is untouched
      - run: |
          foreach ($exe in Get-ChildItem release/PyMusicClient-Setup-*.exe) {
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content "$($exe.FullName).sha256" "$hash  $($exe.Name)" -Encoding ascii -NoNewline
          }
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: release/PyMusicClient-Setup-*.exe*
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem release/PyMusicClient-Setup-*.exe*).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --generate-notes
          }
          exit $LASTEXITCODE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}