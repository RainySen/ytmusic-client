name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-release.txt
      # exact versions + hashes: a tampered or surprise package fails the build
      - run: pip install --require-hashes -r requirements-release.txt
      - run: python -m pytest -q
      - if: startsWith(github.ref, 'refs/tags/v')
        run: ./bump-version.ps1 "${{ github.ref_name }}"
        shell: pwsh
      - run: ./build-release.ps1
        shell: pwsh

      # published hash lets users check the download is untouched
      - run: |
          foreach ($exe in Get-ChildItem release/PyMusicClient-Setup-*.exe) {
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content "$($exe.FullName).sha256" "$hash  $($exe.Name)" -Encoding ascii -NoNewline
          }
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: release/PyMusicClient-Setup-*.exe*
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem release/PyMusicClient-Setup-*.exe*).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --generate-notes
          }
          exit $LASTEXITCODE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}